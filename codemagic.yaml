workflows:
  ios-unsigned-test:
    name: iOS test build (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA (Payload zip)
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r muzik420_unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/muzik420_unsigned.ipa
